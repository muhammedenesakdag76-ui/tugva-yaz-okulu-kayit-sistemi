<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TÜGVA Yaz Okulu Finali ve İstanbul Gezisi</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header>

<div class="logoBox">

<h1>TÜGVA</h1>

<p>
Yaz Okulu Finali ve İstanbul Gezisi
</p>

</div>

</header>

<main>

<section class="card">

<h2>Kayıt Formu</h2>

<p class="info">

31 Temmuz 2026 tarihinde gerçekleştirilecek
TÜGVA Yaz Okulu Finali ve İstanbul Gezisine
katılmak için aşağıdaki formu doldurunuz.

</p>

<div class="counter">

<span>Kalan Kontenjan</span>

<strong id="remainingCount">
85
</strong>

</div>

<form id="registerForm">

<div class="formGroup">

<label>Ad Soyad</label>

<input
id="name"
type="text"
placeholder="Ad Soyad"
required>

</div>

<div class="formGroup">

<label>T.C. Kimlik No</label>

<input
id="tc"
type="text"
maxlength="11"
placeholder="11 Haneli T.C."
required>

</div>

<div class="formGroup">

<label>Doğum Tarihi</label>

<input
id="birth"
type="date"
required>

</div>

<div class="formGroup">

<label>Telefon</label>

<input
id="phone"
type="tel"
placeholder="05XXXXXXXXX"
required>

</div>

<div class="formGroup">

<label>Cinsiyet</label>

<select id="gender">

<option value="">
Seçiniz
</option>

<option value="Erkek">
Erkek
</option>

<option value="Kadın">
Kadın
</option>

</select>

</div>

<label class="checkbox">

<input
type="checkbox"
id="parent">

<span>

18 yaş altındaysam
velim ile katılacağımı kabul ediyorum.

</span>

</label>

<label class="checkbox">

<input
type="checkbox"
id="kvkk">

<span>

KVKK Aydınlatma Metnini
okudum ve kabul ediyorum.

</span>

</label>

<button
type="submit"
id="registerButton">

KAYDI TAMAMLA

</button>

</form>

</section>

<section
class="success hidden"
id="successBox">

<h2>

✅ Kayıt Başarılı

</h2>

<p>

Kaydınız başarıyla oluşturuldu.

</p>

<p>

Kayıt Numarası

</p>

<h3 id="registerNumber">

TYG-0000

</h3>

<div id="qrCode">

</div>

<button id="newRegister">

Yeni Kayıt

</button>

</section>

</main>

<footer>

<p>

© 2026 TÜGVA

</p>

</footer>

<script type="module" src="js/app.js"></script>

</body>
</html>
