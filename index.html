<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TÜGVA Yaz Okulu Finali ve İstanbul Gezisi</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">

<div class="container">

<h1>TÜGVA</h1>

<p>Yaz Okulu Finali ve İstanbul Gezisi</p>

</div>

</header>

<main class="container">

<section class="card" id="formCard">

<h2>Kayıt Formu</h2>

<div class="remaining">

<span>Kalan Kontenjan</span>

<strong id="remainingCount">85</strong>

</div>

<form id="registerForm">

<div class="input">

<label>Ad Soyad</label>

<input
id="name"
type="text"
placeholder="Ad Soyad"
required>

</div>

<div class="input">

<label>T.C. Kimlik No</label>

<input
id="tc"
maxlength="11"
type="text"
placeholder="11 Haneli T.C."
required>

</div>

<div class="input">

<label>Doğum Tarihi</label>

<input
id="birth"
type="date"
required>

</div>

<div class="input">

<label>Telefon</label>

<input
id="phone"
type="tel"
placeholder="05XXXXXXXXX"
required>

</div>

<div class="input">

<label>Cinsiyet</label>

<select id="gender">

<option value="">Seçiniz</option>
<option value="Erkek">Erkek</option>
<option value="Kadın">Kadın</option>

</select>

</div>

<label class="check">

<input
type="checkbox"
id="parent">

<span>

18 yaş altındaysam velim ile katılacağımı kabul ediyorum.

</span>

</label>

<label class="check">

<input
type="checkbox"
id="kvkk">

<span>

KVKK Aydınlatma Metnini okudum ve kabul ediyorum.

</span>

</label>

<button type="submit">

KAYDI TAMAMLA

</button>

</form>

</section>

<section
class="card hidden"
id="successCard">

<h2>Kayıt Başarılı</h2>

<p>

Kayıt Numaranız

</p>

<h1 id="registerNumber">

TYG-0001

</h1>

<div id="qr"></div>

<button id="newRegister">

Yeni Kayıt

</button>

</section>

</main>

<script type="module" src="js/app.js"></script>

</body>
</html>
