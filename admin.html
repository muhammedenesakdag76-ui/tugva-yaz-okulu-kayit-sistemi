<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Yönetici Paneli</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="header">

<div class="container">

<h1>Yönetici Paneli</h1>

<p>TÜGVA Yaz Okulu Finali ve İstanbul Gezisi</p>

</div>

</header>

<main class="container">

<section class="card">

<h2>Kayıt Yönetimi</h2>

<div class="remaining">

<span>Toplam Kayıt</span>

<strong id="totalCount">0 / 85</strong>

</div>

<div class="toolbar">

<input
id="search"
type="text"
placeholder="Ad Soyad veya T.C. Ara">

<button id="refreshBtn">
Yenile
</button>

</div>

<div class="tableBox">

<table>

<thead>

<tr>

<th>#</th>
<th>Kayıt No</th>
<th>Ad Soyad</th>
<th>T.C.</th>
<th>Telefon</th>
<th>Cinsiyet</th>
<th>Sil</th>

</tr>

</thead>

<tbody id="tbody">

</tbody>

</table>

</div>

<div class="actions">

<button id="excelBtn">

Excel'e Aktar

</button>

</div>

</section>

</main>

<script type="module" src="js/admin.js"></script>

</body>

</html>
